name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm test
      - name: Fetch ffmpeg
        shell: bash
        run: |
          bash scripts/fetch-ffmpeg
          echo "$PWD/src-tauri/binaries" >> "$GITHUB_PATH"
      - name: Put ffmpeg on PATH for the export tests
        shell: bash
        run: |
          cd src-tauri/binaries
          for file in ffmpeg-* ffprobe-*; do
            case "$file" in
              *.exe) cp "$file" "${file%%-*}.exe" ;;
              *) cp "$file" "${file%%-*}" ;;
            esac
          done
      - run: bash scripts/make-test-clips
        shell: bash
      - run: cargo test
        working-directory: src-tauri
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: videotay-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
